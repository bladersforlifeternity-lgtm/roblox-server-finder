<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🧠 Brainrot Server Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #222230;
    --accent: #7c3aff;
    --accent2: #ff3aaa;
    --text: #e8e8ff;
    --muted: #6666aa;
    --green: #3affb4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 50% at 20% -10%, rgba(124,58,255,0.15) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 110%, rgba(255,58,170,0.1) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  .wrapper { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 40px 20px; }

  header { text-align: center; margin-bottom: 50px; }
  header .tag {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  h1 {
    font-size: clamp(2.2rem, 6vw, 3.8rem);
    font-weight: 800;
    line-height: 1.1;
    background: linear-gradient(135deg, #e8e8ff 30%, var(--accent) 70%, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  header p { color: var(--muted); font-size: 1rem; font-family: 'Space Mono', monospace; }

  .status-bar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 30px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    align-items: center;
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; display: inline-block; margin-right: 6px; }
  .status-dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .pill { font-family: 'Space Mono', monospace; font-size: 11px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); color: var(--muted); }
  .pill.active { border-color: var(--accent); color: var(--accent); }

  .controls { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
  input[type=text] {
    flex: 1;
    min-width: 200px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type=text]:focus { border-color: var(--accent); }
  input[type=text]::placeholder { color: var(--muted); }

  button {
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    transition: all 0.2s;
    user-select: none;
  }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; }
  .btn-primary:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Progress bar under buttons when searching */
  .progress-bar-wrap {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 28px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .progress-bar-wrap.show { opacity: 1; }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* ── Live terminal ───────────────────────────────────────────────────────── */
  .terminal {
    display: none;
    background: #080810;
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 28px;
    font-family: 'Space Mono', monospace;
  }
  .terminal.show { display: block; }
  .terminal-header {
    background: #111120;
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .terminal-dot { width: 10px; height: 10px; border-radius: 50%; }
  .terminal-title { font-size: 11px; color: var(--muted); margin-left: 4px; }
  .terminal-body {
    padding: 14px 16px;
    max-height: 280px;
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  .terminal-line {
    font-size: 12px;
    line-height: 1.8;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateX(-4px)} to{opacity:1;transform:translateX(0)} }
  .terminal-line .ts { color: #3a3a5a; flex-shrink: 0; }
  .terminal-line.running .msg { color: var(--muted); }
  .terminal-line.found   .msg { color: var(--green); }
  .terminal-line.empty   .msg { color: #4a4a6a; }
  .terminal-line.error   .msg { color: #ff6b6b; }
  .terminal-line.done    .msg { color: #ffd54f; font-weight: bold; }
  .terminal-line.start   .msg { color: var(--accent); }
  .terminal-cursor { display: inline-block; width: 7px; height: 14px; background: var(--accent); animation: blink 1s step-end infinite; vertical-align: middle; margin-left: 4px; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 0 4px; }
  .count-badge {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 20px;
  }
  .sort-btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
  }

  .results-grid { display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: all 0.2s;
    animation: fadeUp 0.3s ease both;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  .card:hover { border-color: var(--accent); background: #13131e; }
  .card-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, rgba(124,58,255,0.2), rgba(255,58,170,0.2));
    border: 1px solid rgba(124,58,255,0.3);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .card-body { flex: 1; overflow: hidden; }
  .card-code { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--green); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-source { font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-provider { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-family: 'Space Mono', monospace; flex-shrink: 0; }
  .card-provider.reddit    { background: rgba(255,69,0,0.15);   color: #ff8c5a; border: 1px solid rgba(255,69,0,0.3); }
  .card-provider.youtube   { background: rgba(255,0,0,0.15);    color: #ff6b6b; border: 1px solid rgba(255,0,0,0.3); }
  .card-provider.google    { background: rgba(66,133,244,0.15); color: #7baeff; border: 1px solid rgba(66,133,244,0.3); }
  .card-provider.web       { background: rgba(58,255,180,0.1);  color: #3affb4; border: 1px solid rgba(58,255,180,0.25); }
  .card-provider.rbxservers{ background: rgba(180,58,255,0.1);  color: #c97aff; border: 1px solid rgba(180,58,255,0.25); }

  /* ── Filter bar ──────────────────────────────────────────────────────────── */
  .filter-bar {
    display: none;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .filter-bar.show { display: flex; }
  .filter-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-right: 4px;
  }
  .filter-btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active-all     { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: white; }
  .filter-btn.active-reddit  { background: rgba(255,69,0,0.2);   border-color: #ff8c5a; color: #ff8c5a; }
  .filter-btn.active-youtube { background: rgba(255,0,0,0.2);    border-color: #ff6b6b; color: #ff6b6b; }
  .filter-btn.active-google  { background: rgba(66,133,244,0.2); border-color: #7baeff; color: #7baeff; }
  .filter-btn.active-web     { background: rgba(58,255,180,0.1); border-color: #3affb4; color: #3affb4; }
  .filter-count {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    background: rgba(255,255,255,0.08);
    padding: 1px 6px;
    border-radius: 10px;
    margin-left: 4px;
  }

  .btn-join {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white; border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 12px; font-weight: 700;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
    text-decoration: none; display: inline-block;
  }
  .btn-join:hover { opacity: 0.8; }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 13px; display: none; }
  .empty.show { display: block; }
  .empty-icon { font-size: 48px; margin-bottom: 16px; }

  .warn-box {
    background: rgba(255,180,0,0.08);
    border: 1px solid rgba(255,180,0,0.3);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 24px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: #ffd54f;
    display: none;
  }
  .warn-box.show { display: block; }
  .warn-box strong { display: block; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <div class="tag">🔍 Roblox · Private Server Scanner</div>
    <h1>Steal a Brainrot<br/>Server Finder</h1>
    <p>Scans Reddit &amp; YouTube for publicly shared private server links</p>
  </header>

  <div class="status-bar" id="statusBar">
    <span><span class="status-dot" id="statusDot"></span><span id="statusText" style="font-family:'Space Mono',monospace;font-size:12px;">checking...</span></span>
    <span class="pill active" id="pillReddit">Reddit ✓</span>
    <span class="pill" id="pillYoutube">YouTube ✗</span>
    <span class="pill" id="pillGoogle">Google ✗</span>
    <span style="margin-left:auto;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted)" id="lastFetch">—</span>
  </div>

  <div class="controls" style="flex-direction:column;gap:8px;">
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <input type="text" id="queryInput" placeholder='🔤 Keyword (e.g. "free server" — leave empty for default)' />
      <button class="btn-primary" id="searchBtn" onclick="doSearch()">🔍 Find Servers</button>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
      <input type="text" id="siteInput" placeholder='🌐 Website (e.g. progameguides.com — optional)' style="flex:1;min-width:200px;" />
      <span id="siteStatus" style="font-family:\'Space Mono\',monospace;font-size:11px;color:var(--muted);white-space:nowrap;"></span>
    </div>
  </div>

  <!-- Thin progress bar -->
  <div class="progress-bar-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="terminal" id="terminal">
    <div class="terminal-header">
      <div class="terminal-dot" style="background:#ff5f57"></div>
      <div class="terminal-dot" style="background:#febc2e"></div>
      <div class="terminal-dot" style="background:#28c840"></div>
      <span class="terminal-title">brainrot-server-finder — live scan</span>
    </div>
    <div class="terminal-body" id="terminalBody">
    </div>
  </div>

  <div id="resultsSection" style="display:none">
    <div class="results-header">
      <span class="count-badge" id="countBadge">0 servers found</span>
      <button class="sort-btn" onclick="copyAll()">📋 Copy all links</button>
    </div>
    <!-- Filter bar -->
    <div class="filter-bar" id="filterBar">
      <span class="filter-label">Filter:</span>
      <button class="filter-btn active-all" id="filterAll"     onclick="setFilter('all')">All <span class="filter-count" id="countAll">0</span></button>
      <button class="filter-btn"            id="filterReddit"  onclick="setFilter('reddit')">🔴 Reddit <span class="filter-count" id="countReddit">0</span></button>
      <button class="filter-btn"            id="filterYoutube" onclick="setFilter('youtube')">▶️ YouTube <span class="filter-count" id="countYoutube">0</span></button>
      <button class="filter-btn"            id="filterGoogle"  onclick="setFilter('google')">🔵 Google <span class="filter-count" id="countGoogle">0</span></button>
      <button class="filter-btn"            id="filterWeb"     onclick="setFilter('web')">🌐 Web <span class="filter-count" id="countWeb">0</span></button>
    </div>
    <div class="results-grid" id="resultsGrid"></div>
  </div>

  <div class="empty" id="emptyState">
    <div class="empty-icon">🧠</div>
    <p>No servers found.<br/>Try a different query or check back later.</p>
  </div>
</div>

<script>
let currentResults = [];
let activeController = null;
let searchLocked = false;
let progressTimer = null;
let activeFilter = 'all';

// Must match GUIDE_SITES on the server
const KNOWN_SITES = [
  'gamerant.com','progameguides.com','gamertweak.com','deltiasgaming.com',
  'techwiser.com','thegamer.com','scriptrot.com','rosenberryrooms.com',
  'findingdulcinea.com','allthings.how','boundbyflame.com','pocketgamer.com',
  'gameskeys.net','gamesatlas.net','sportskeeda.com','stealabrainrot.fandom.com',
];

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('siteInput').addEventListener('input', onSiteInput);
  document.getElementById('queryInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  loadStatus();
});

// ── Simulated progress bar ────────────────────────────────────────────────────
function startProgress() {
  const bar = document.getElementById('progressBar');
  const wrap = document.getElementById('progressWrap');
  wrap.classList.add('show');
  let pct = 0;
  bar.style.width = '0%';
  clearInterval(progressTimer);
  progressTimer = setInterval(() => {
    if (pct < 80) pct += Math.random() * 6;
    else if (pct < 95) pct += 0.2;
    bar.style.width = pct + '%';
  }, 400);
}
function finishProgress() {
  clearInterval(progressTimer);
  const bar = document.getElementById('progressBar');
  const wrap = document.getElementById('progressWrap');
  bar.style.width = '100%';
  setTimeout(() => { wrap.classList.remove('show'); bar.style.width = '0%'; }, 600);
}

// ── Status check ─────────────────────────────────────────────────────────────
async function loadStatus() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    document.getElementById('statusDot').className = 'status-dot on';
    document.getElementById('statusText').textContent = d.fetchInProgress ? 'Fetching…' : 'API Online';

    if (d.providers.youtube) {
      const p = document.getElementById('pillYoutube');
      p.textContent = 'YouTube ✓';
      p.className = 'pill active';
    }
    if (d.providers.google) {
      const p = document.getElementById('pillGoogle');
      p.textContent = 'Google ✓';
      p.className = 'pill active';
    }

    if (d.lastFetch) document.getElementById('lastFetch').textContent = 'Last: ' + new Date(d.lastFetch).toLocaleTimeString();
  } catch(e) {
    document.getElementById('statusText').textContent = 'Offline';
    document.getElementById('statusDot').style.background = '#ff4444';
  }
}

// ── Terminal log ──────────────────────────────────────────────────────────────
let termCursor = null;

function termLog(msg, status = 'running') {
  const body = document.getElementById('terminalBody');
  // Remove cursor from previous line
  if (termCursor) { termCursor.remove(); termCursor = null; }

  const line = document.createElement('div');
  line.className = 'terminal-line ' + status;

  const ts = document.createElement('span');
  ts.className = 'ts';
  const now = new Date();
  ts.textContent = now.toLocaleTimeString('en-US', { hour12: false, hour:'2-digit', minute:'2-digit', second:'2-digit' });

  const m = document.createElement('span');
  m.className = 'msg';
  m.textContent = msg;

  line.appendChild(ts);
  line.appendChild(m);

  if (status === 'running') {
    termCursor = document.createElement('span');
    termCursor.className = 'terminal-cursor';
    line.appendChild(termCursor);
  }

  body.appendChild(line);
  body.scrollTop = body.scrollHeight;
}

function termClear() {
  document.getElementById('terminalBody').innerHTML = '';
  termCursor = null;
}

// ── Site input validator ──────────────────────────────────────────────────────
function onSiteInput() {
  const val = document.getElementById('siteInput').value.trim().toLowerCase().replace(/^https?:\/\//, '').replace(/\/.*/, '');
  const status = document.getElementById('siteStatus');
  if (!val) { status.textContent = ''; return; }
  const known = KNOWN_SITES.some(s => s.includes(val) || val.includes(s.replace('www.','')));
  if (known) {
    status.textContent = '✓ Site supported';
    status.style.color = '#3aff64';
  } else {
    status.textContent = '✗ No API found — will try generic scrape';
    status.style.color = '#ff6b6b';
  }
}

// ── Main search ───────────────────────────────────────────────────────────────
async function doSearch() {
  if (searchLocked) return;
  searchLocked = true;

  if (activeController) activeController.abort();
  activeController = new AbortController();

  const btn            = document.getElementById('searchBtn');
  const terminal       = document.getElementById('terminal');
  const resultsSection = document.getElementById('resultsSection');
  const emptyState     = document.getElementById('emptyState');
  const query          = document.getElementById('queryInput').value.trim();
  const site           = document.getElementById('siteInput').value.trim().toLowerCase().replace(/^https?:\/\//, '').replace(/\/$/, '');

  btn.disabled = true;
  termClear();
  terminal.classList.add('show');
  resultsSection.style.display = 'none';
  emptyState.classList.remove('show');
  startProgress();

  try {
    let url = '/api/search-stream';
    const params = [];
    if (query) params.push('q=' + encodeURIComponent(query));
    if (site)  params.push('site=' + encodeURIComponent(site));
    if (params.length) url += '?' + params.join('&');

    const es = new EventSource(url);

    await new Promise((resolve, reject) => {
      es.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.type === 'log') termLog(data.msg, data.status || 'running');
          if (data.type === 'done') {
            es.close();
            finishProgress();
            currentResults = data.results || [];
            if (currentResults.length === 0) {
              terminal.classList.remove('show');
              emptyState.classList.add('show');
            } else {
              renderResults(currentResults);
            }
            document.getElementById('lastFetch').textContent = 'Last: ' + new Date().toLocaleTimeString();
            document.getElementById('statusText').textContent = 'API Online';
            resolve();
          }
        } catch(err) {}
      };
      es.onerror = () => { es.close(); finishProgress(); reject(new Error('Stream disconnected')); };
      activeController.signal.addEventListener('abort', () => { es.close(); resolve(); });
    });
  } catch(e) {
    finishProgress();
    if (e.name !== 'AbortError') termLog('❌ Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    searchLocked = false;
  }
}

// ── Filter ────────────────────────────────────────────────────────────────────
function setFilter(f) {
  activeFilter = f;
  document.getElementById('filterAll').className     = 'filter-btn' + (f === 'all'     ? ' active-all'     : '');
  document.getElementById('filterReddit').className  = 'filter-btn' + (f === 'reddit'  ? ' active-reddit'  : '');
  document.getElementById('filterYoutube').className = 'filter-btn' + (f === 'youtube' ? ' active-youtube' : '');
  document.getElementById('filterGoogle').className  = 'filter-btn' + (f === 'google'  ? ' active-google'  : '');
  document.getElementById('filterWeb').className     = 'filter-btn' + (f === 'web'     ? ' active-web'     : '');
  applyFilter();
}

function applyFilter() {
  const filtered = activeFilter === 'all'
    ? currentResults
    : currentResults.filter(r => r.provider === activeFilter);

  const badge = document.getElementById('countBadge');
  badge.textContent = filtered.length + ' server' + (filtered.length !== 1 ? 's' : '') + ' found';

  buildCards(filtered);

  // Show empty state if filter yields nothing
  const empty = document.getElementById('emptyState');
  if (filtered.length === 0 && currentResults.length > 0) {
    empty.innerHTML = '<div class="empty-icon">🔍</div><p>No ' + activeFilter + ' results found.</p>';
    empty.classList.add('show');
    document.getElementById('resultsGrid').style.display = 'none';
  } else {
    empty.classList.remove('show');
    document.getElementById('resultsGrid').style.display = '';
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function safeText(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function renderResults(results) {
  const badge = document.getElementById('countBadge');
  badge.textContent = results.length + ' server' + (results.length !== 1 ? 's' : '') + ' found';

  // Count per provider
  const counts = { all: results.length, reddit: 0, youtube: 0, google: 0, web: 0 };
  results.forEach(r => { if (counts[r.provider] !== undefined) counts[r.provider]++; });

  document.getElementById('countAll').textContent     = counts.all;
  document.getElementById('countReddit').textContent  = counts.reddit;
  document.getElementById('countYoutube').textContent = counts.youtube;
  document.getElementById('countGoogle').textContent  = counts.google;
  document.getElementById('countWeb').textContent     = counts.web;

  // Show filter bar whenever there are results (even if only one provider)
  document.getElementById('filterBar').classList.toggle('show', results.length > 0);

  // Reset to 'all' on fresh results
  activeFilter = 'all';
  setFilter('all');

  document.getElementById('resultsSection').style.display = 'block';
}

function buildCards(results) {
  const grid = document.getElementById('resultsGrid');
  grid.innerHTML = '';

  results.forEach((r, i) => {
    let sourceHost = 'unknown';
    try { sourceHost = new URL(r.source).hostname; } catch(_) {}

    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (i * 35) + 'ms';

    // Icon
    const icon = document.createElement('div');
    icon.className = 'card-icon';
    const icons = { youtube: '▶️', google: '🔵', rbxservers: '🟣', web: '🌐' };
    icon.textContent = icons[r.provider] || '🔗';

    // Body
    const body = document.createElement('div');
    body.className = 'card-body';

    const code = document.createElement('div');
    code.className = 'card-code';
    code.textContent = r.url;

    const source = document.createElement('div');
    source.className = 'card-source';
    source.textContent = 'via ' + sourceHost + ' · ' + (r.title || '');

    body.appendChild(code);
    body.appendChild(source);

    // Age badge — shows how old the post is
    const ageBadge = document.createElement('span');
    if (r.postedAt) {
      const diffMs = Date.now() - new Date(r.postedAt);
      const diffDays = Math.floor(diffMs / 86400000);
      const diffHours = Math.floor(diffMs / 3600000);
      let ageText, ageColor;
      if (diffHours < 24)       { ageText = diffHours + 'h ago';   ageColor = '#3aff64'; }
      else if (diffDays < 7)    { ageText = diffDays + 'd ago';    ageColor = '#3aff64'; }
      else if (diffDays < 30)   { ageText = diffDays + 'd ago';    ageColor = '#ffd54f'; }
      else                      { ageText = diffDays + 'd ago';    ageColor = '#ff6b6b'; }
      ageBadge.textContent = ageText;
      ageBadge.style.cssText = `font-family:'Space Mono',monospace;font-size:10px;padding:2px 7px;border-radius:4px;background:rgba(0,0,0,0.2);color:${ageColor};border:1px solid ${ageColor}44;flex-shrink:0;`;
    } else {
      ageBadge.textContent = 'web source';
      ageBadge.style.cssText = "font-family:'Space Mono',monospace;font-size:10px;padding:2px 7px;border-radius:4px;background:rgba(58,255,180,0.08);color:#3affb4;border:1px solid rgba(58,255,180,0.2);flex-shrink:0;";
    }

    // Type badge
    const typeBadge = document.createElement('span');
    typeBadge.textContent = r.type || 'Server';
    typeBadge.style.cssText = "font-family:'Space Mono',monospace;font-size:10px;padding:2px 8px;border-radius:4px;background:rgba(58,255,180,0.1);color:var(--green);border:1px solid rgba(58,255,180,0.25);flex-shrink:0;";

    // Provider badge
    const providerBadge = document.createElement('span');
    providerBadge.className = 'card-provider ' + (r.provider || 'reddit');
    providerBadge.textContent = r.provider || 'reddit';

    // Join button
    const joinBtn = document.createElement('a');
    joinBtn.className = 'btn-join';
    joinBtn.href = r.url;
    joinBtn.target = '_blank';
    joinBtn.rel = 'noopener';
    joinBtn.textContent = 'Join →';

    card.appendChild(icon);
    card.appendChild(body);
    card.appendChild(ageBadge);
    card.appendChild(typeBadge);
    card.appendChild(providerBadge);
    card.appendChild(joinBtn);
    grid.appendChild(card);
  });
}

function copyAll() {
  if (!currentResults.length) return;
  const filtered = activeFilter === 'all'
    ? currentResults
    : currentResults.filter(r => r.provider === activeFilter);
  navigator.clipboard.writeText(filtered.map(r => r.url).join('\n'))
    .then(() => alert('Copied ' + filtered.length + ' links!'));
}

document.getElementById('queryInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doSearch();
});

loadStatus();
</script>
</body>
</html>
